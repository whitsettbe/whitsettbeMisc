<!DOCTYPE html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
        <script src="https://unpkg.com/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
        <script src="utils.js"></script>
        <script>
            AFRAME.registerComponent("some-line", {
                schema: {
                    height: { type: "number", default: 2 },
                    numLines: { type: "int", default: 6 }
                },
                init: function()
                {
                    this.lines = [];
                    this.updateGeometry = this.updateGeometry.bind(this);
                    this.updateGeometry();
                },
                update: function()
                {
                    this.updateGeometry();
                },
                updateGeometry: function()
                {
                    const points = [];
                    const nPts = 20;
                    const height = this.data.height;
                    const numLines = this.data.numLines;

                    for (let i = 0; i < numLines; i++)
                    {
                        points.push([]);
                        for (let j = 0; j <= nPts; j++)
                        {
                            points[i].push(new THREE.Vector3(
                                Math.cos((j / nPts + i / numLines) * 2 * Math.PI),
                                (j / nPts - 0.5) * height,
                                Math.sin((j / nPts + i / numLines) * 2 * Math.PI)
                            ));
                        }
                    }

                    if (this.lines)
                    {
                        for (const line of this.lines)
                        {
                            this.el.object3D.remove(line);
                        }
                    }

                    const material = new THREE.LineBasicMaterial({ color: 0x0000ff });
                    for (let i = 0; i < numLines; i++)
                    {
                        const geometry = new THREE.BufferGeometry().setFromPoints(points[i]);
                        this.lines.push(new THREE.Line(geometry, material));
                        this.el.object3D.add(this.lines[this.lines.length - 1]);
                    }
                }
            });

            document.addEventListener("DOMContentLoaded", function()
            {
                const lineEl = document.querySelector("[some-line]");
                const heightSlider = document.getElementById("height-slider");
                const heightInput = document.getElementById("height-input");
                const countInput = document.getElementById("count-input");

                function syncHeight(value)
                {
                    const safeValue = Number(value);
                    if (!Number.isFinite(safeValue)) return;
                    if (lineEl)
                    {
                        lineEl.setAttribute("some-line", "height", safeValue);
                    }
                    if (heightSlider) heightSlider.value = String(safeValue);
                    if (heightInput) heightInput.value = String(safeValue);
                }

                if (heightSlider)
                {
                    heightSlider.addEventListener("input", function(event)
                    {
                        syncHeight(event.target.value);
                    });
                }

                if (heightInput)
                {
                    heightInput.addEventListener("input", function(event)
                    {
                        syncHeight(event.target.value);
                    });
                }

                if (lineEl && heightSlider)
                {
                    syncHeight(heightSlider.value);
                }

                if (countInput)
                {
                    countInput.addEventListener("input", function(event)
                    {
                        lineEl.setAttribute("some-line", "numLines", event.target.value);
                    });
                }
            });
        </script>
        <style>

            html, body
            {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }

            .container
            {
                display: grid;
                grid-template-columns: 50% 50%;
                height: 100%;
            }
            .container-cell
            {
                border: 1px solid black;
                font-size: 30px;
                text-align: center;
            }
        </style>
    </head>
    <body>

        <div class="container">
        <div id="controls" class="container-cell">
            <h3>Adjust Line Height</h3>
            <input type="range" id="height-slider" min="0" max="10" step="0.1" value="2"><br>
            <input type="number" id="height-input" min="0" max="10" step="0.1" value="2">

            <h3>Adjust Line Count</h3>
            <input type="number" id="count-input" min="2" step="1" value="6">
        </div>
        <div id="scene-container" class="container-cell">
            <a-scene embedded>
                <a-sphere position="0 0 0" radius="0.5" color="#EF2D5E" some-line></a-sphere>
                <a-entity light="type: ambient; color: #bbb"></a-entity>
                <a-entity light="type: directional; color: #FFF; intensity: 0.95" position="-0.5 1 1"></a-entity>
                <a-entity
                        camera
                        look-controls="enabled: false"
                        orbit-controls="target: 0 0 0; minDistance: 2; maxDistance: 180; initialPosition: 0 3 5; rotateSpeed: 0.5; minPolarAngle: 0; maxPolarAngle: 180">
                    </a-entity>
                <!--<a-entity position="0 0 0" some-line></a-entity>-->
                <a-sky color="#ECECEC"></a-sky>
            </a-scene></div>
        </div>

    </body>
</html>
